<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>硅基流动分析助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>硅基流动分析助手</h1>
    
    <div class="form-group">
      <label for="apiKey">API Key:</label>
      <input type="password" id="apiKey" placeholder="输入您的硅基流动 API Key">
      <button id="saveApiKey">保存</button>
    </div>
    
    <div class="form-group">
      <label for="systemPrompt">系统提示词:</label>
      <textarea id="systemPrompt" rows="3" placeholder="输入系统提示词">You are a helpful assistant.</textarea>
    </div>
    
    <div class="form-group">
      <label for="model">模型:</label>
      <select id="model">
        <option value="deepseek-ai/DeepSeek-V3" selected>DeepSeek-V3</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="temperature">温度 (0.0-1.0):</label>
      <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7">
      <span id="temperatureValue">0.7</span>
    </div>
    
    <div class="form-group">
      <label for="maxTokens">最大 Token 数:</label>
      <input type="number" id="maxTokens" min="1" max="4096" value="1024">
    </div>
    
    <div class="actions">
      <button id="saveSettings">保存设置</button>
    </div>
    
    <div class="instructions">
      <p>使用方法:</p>
      <ol>
        <li>在网页上选择文本</li>
        <li>右键点击并选择"使用硅基流动分析"</li>
        <li>或使用快捷键 (Ctrl+Shift+S)</li>
      </ol>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
